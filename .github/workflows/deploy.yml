name: Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform backend
        run: |
          chmod +x setup-terraform-backend.sh
          ./setup-terraform-backend.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.11.4"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:tailwind

      - name: Prepare static site for deploy
        run: |
          mkdir -p dist/vectorscope-ai/browser
          cp index.html index.js pitch-deck.html sitemap.xml robots.txt dist/vectorscope-ai/browser/
          cp -r css assets dist/vectorscope-ai/browser/

      - name: Upload website files to S3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws s3 sync dist/vectorscope-ai/browser/ s3://vectorscopeai.com/ \
            --delete \
            --cache-control "public, max-age=86400"
          # Overwrite HTML with no-cache so CTA/copy updates are not stuck behind CloudFront TTL.
          for page in index.html pitch-deck.html; do
            aws s3 cp "dist/vectorscope-ai/browser/${page}" "s3://vectorscopeai.com/${page}" \
              --cache-control "no-cache, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $(terraform output -raw cloudfront_distribution_id) \
            --paths "/*" "/index.html" "/" 